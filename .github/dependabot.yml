version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A major version of the database requires a data migration, do it manually
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
